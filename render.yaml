services:
  - type: web
    name: unicommu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: unicommu-web
    runtime: static
    buildCommand: npm ci --include=dev && npx expo export --platform web
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /post/*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: EXPO_PUBLIC_API_URL
        sync: false
